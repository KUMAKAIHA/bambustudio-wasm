<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BambuStudio · WebAssembly</title>
<style>
  :root {
    --bg: #1E2224;
    --panel: #262E30;
    --border: #3B4446;
    --fg: #E8EAEA;
    --dim: #8A9496;
    --accent: #07B047;
    --err: #E15554;
    --warn: #E8A33D;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .badge {
    font-size: 11px; padding: 2px 7px; border-radius: 3px;
    background: #1a3d2a; color: var(--accent);
    border: 1px solid #2a5a3e;
  }
  header .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--dim); }

  main { flex: 1; display: flex; min-height: 0; }

  #drop {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; padding: 32px; text-align: center;
    border: 2px dashed var(--border);
    margin: 24px; border-radius: 8px;
    transition: border-color .15s, background .15s;
  }
  #drop.hot { border-color: var(--accent); background: #17301f; }
  #drop h2 { margin: 0; font-size: 16px; font-weight: 500; }
  #drop p { margin: 0; color: var(--dim); font-size: 12px; max-width: 460px; }
  #drop button {
    padding: 8px 20px; font-size: 13px; cursor: pointer;
    background: var(--accent); color: #06250f;
    border: 0; border-radius: 4px; font-weight: 600;
  }
  #drop button:disabled { opacity: .4; cursor: not-allowed; }

  #log {
    width: 380px; flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: #191D1F;
    overflow-y: auto; padding: 12px;
    font: 11px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  #log .line { white-space: pre-wrap; word-break: break-word; }
  #log .ok   { color: var(--accent); }
  #log .err  { color: var(--err); }
  #log .warn { color: var(--warn); }
  #log .dim  { color: var(--dim); }

  #bar {
    height: 3px; background: var(--border);
    position: relative; overflow: hidden;
  }
  #bar > i {
    display: block; height: 100%; width: 0%;
    background: var(--accent); transition: width .2s;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>BambuStudio</h1>
    <span class="badge">WebAssembly · 本地算力</span>
    <span class="spacer"></span>
    <span id="status">初始化…</span>
  </header>
  <div id="bar"><i></i></div>
  <main>
    <div id="drop">
      <h2>拖入模型开始</h2>
      <p>STL / OBJ / 3MF。文件不会离开你的电脑 —— 切片在你的浏览器里用 WASM 完成，没有任何服务器参与。</p>
      <button id="pick" disabled>选择文件</button>
      <input id="file" type="file" accept=".stl,.obj,.3mf" hidden>
    </div>
    <div id="log"></div>
  </main>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
